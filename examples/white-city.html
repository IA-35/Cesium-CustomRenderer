<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <title>CCR · 城市白模</title>
    <link rel="stylesheet" href="/node_modules/cesium/Build/Cesium/Widgets/widgets.css">
    <style>
        html,
        body,
        #scene {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            font: 14px system-ui
        }

        aside {
            position: absolute;
            top: 18px;
            left: 18px;
            width: 230px;
            padding: 18px;
            background: #14202de8;
            color: #e5edf5;
            border: 1px solid #536677;
            border-radius: 10px
        }

        h1 {
            font-size: 18px;
            margin: 0 0 12px
        }

        label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 14px 0
        }

        input[type=range] {
            width: 125px
        }

        button {
            background: #25394a;
            color: inherit;
            border: 1px solid #52667a;
            border-radius: 5px;
            padding: 7px;
            margin: 3px;
            cursor: pointer
        }

        small {
            color: #b1c3d3;
            line-height: 1.6
        }
    </style>
    <script>window.CESIUM_BASE_URL = '/node_modules/cesium/Build/Cesium/'</script>
    <script src="/node_modules/cesium/Build/Cesium/Cesium.js"></script>
</head>

<body>
    <div id="scene"></div>
    <aside>
        <h1>CCR · 城市白模</h1><small>中性白色 · HDR · 环境反射</small>
        <label>屏幕反射<input id="ssr" type="checkbox" checked></label><label>高光扩散<input id="bloom" type="checkbox"
                checked></label>
        <label>曝光<input id="exposure" type="range" min=".5" max="2" step=".05" value="1.5"></label>
        <label>泛光强度<input id="strength" type="range" min="0" max=".5" step=".01" value=".08"></label>
        <button id="street">街区近景</button><button id="overview">城市全景</button><small id="status">正在加载本地城市…</small>
    </aside>
    <script src="./runtime-config.js"></script>
    <script type="module" src="./white-city.js"></script>
</body>

</html>
