<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>最小 Cesium 场景</title>
<style>html,body,#cesiumContainer{margin:0;width:100%;height:100%;overflow:hidden}</style>
<script>window.CESIUM_BASE_URL='/node_modules/cesium/Build/Cesium/'</script>
<script src="/node_modules/cesium/Build/Cesium/Cesium.js"></script>
</head>
<body>
<div id="cesiumContainer"></div>
<script>
  const viewer = new Cesium.Viewer('cesiumContainer', {
    baseLayer: false, baseLayerPicker: false, geocoder: false,
    timeline: false, animation: false, sceneModePicker: false, homeButton: false,
    navigationHelpButton: false
  })
  viewer.scene.globe.show = true
  viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString('#52654c')
  // 初始视角对准南湖校区
  viewer.camera.setView({
    destination: Cesium.Cartesian3.fromDegrees(123.410315, 41.761969, 1800),
    orientation: { heading: 0, pitch: -0.65, roll: 0 }
  })
  window.__viewer = viewer
  window.__cc = viewer.scene.screenSpaceCameraController
  console.log('DEFAULT translateEventTypes=', window.__cc.translateEventTypes, 'rotateEventTypes=', window.__cc.rotateEventTypes)
</script>
</body>
</html>
