<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>CCR B07 SSR surfaces fixture</title>
    <link rel="stylesheet" href="/node_modules/cesium/Build/Cesium/Widgets/widgets.css">
    <style>
        html,
        body,
        #scene {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000
        }
    </style>
    <script>window.CESIUM_BASE_URL = '/node_modules/cesium/Build/Cesium/'</script>
    <script src="/node_modules/cesium/Build/Cesium/Cesium.js"></script>
</head>

<body>
    <div id="scene"></div>
    <script type="module">
        const query = new URLSearchParams(location.search)
        const viewer = new Cesium.Viewer('scene', {
            baseLayer: false,
            terrainProvider: new Cesium.EllipsoidTerrainProvider(),
            animation: false, timeline: false, baseLayerPicker: false, geocoder: false,
            infoBox: false, sceneModePicker: false, navigationHelpButton: false, homeButton: false,
            contextOptions: { webgl: { preserveDrawingBuffer: true } },
            orderIndependentTranslucency: true,
            shouldAnimate: false,
        })
        viewer.scene.globe.show = false
        const errors = []
        viewer.scene.renderError.addEventListener((scene, error) => {
            errors.push(error && error.stack ? error.stack : String(error))
        })
        const CCR = await import('/src/index.js')
        window.fixture = { viewer, CCR, errors, options: { terrain: query.get('terrain') || 'none' } }
    </script>
</body>

</html>
